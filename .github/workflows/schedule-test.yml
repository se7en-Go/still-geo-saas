name: ⏰ Schedule触发器测试

# 极简工作流专门用于验证schedule触发器是否工作
on:
  schedule:
    # 每5分钟执行 - 快速验证schedule是否工作
    - cron: '*/5 * * * *'

  workflow_dispatch:
    inputs:
      reason:
        description: '手动测试原因'
        required: false
        default: '手动验证'

jobs:
  test-schedule-trigger:
    name: 🔍 验证Schedule触发器
    runs-on: ubuntu-latest

    steps:
      - name: 🕐 记录关键信息
        run: |
          echo "=========================================="
          echo "🚨 GitHub Actions Schedule 触发器测试"
          echo "=========================================="
          echo ""
          echo "📅 当前时间: $(date '+%Y-%m-%d %H:%M:%S UTC')"
          echo "🔧 触发事件: ${{ github.event_name }}"
          echo "🆔 工作流ID: ${{ github.run_id }}"
          echo "🏃 运行编号: ${{ github.run_number }}"
          echo "👤 执行者: ${{ github.actor }}"
          echo ""

          # 关键诊断
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "✅ SUCCESS: Schedule触发器正常工作!"
            echo "🎉 这证明了GitHub Actions调度功能正常"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "⚠️  WARNING: 这是手动触发"
            echo "❓ Schedule触发器可能不工作"
            echo "🎯 手动输入: ${{ github.event.inputs.reason }}"
          else
            echo "❓ UNKNOWN: 未知触发类型 ${{ github.event_name }}"
          fi

          echo ""
          echo "📊 环境信息:"
          echo "  仓库: ${{ github.repository }}"
          echo "  分支: ${{ github.ref_name }}"
          echo "  提交: ${{ github.sha }}"
          echo ""

      - name: 🌐 快速网络测试
        run: |
          echo "🔍 测试后端服务连接..."

          # 测试API健康检查
          echo "📡 测试: https://geo-backend-vp34.onrender.com/api/health"

          HTTP_CODE=$(curl -s -w "状态码: %{http_code} | 响应时间: %{time_total}s" \
            --connect-timeout 15 \
            --max-time 30 \
            -H "User-Agent: ScheduleTest/1.0" \
            -o /tmp/health.json \
            "https://geo-backend-vp34.onrender.com/api/health" 2>/dev/null)

          echo "📊 测试结果: $HTTP_CODE"

          if [ -f /tmp/health.json ]; then
            echo "📄 响应内容:"
            cat /tmp/health.json | head -3 || echo "响应为空"
          fi

          echo ""

      - name: 📝 创建测试日志
        run: |
          LOG_FILE="schedule-test-$(date +%Y%m%d).log"

          # 记录到日志文件
          echo "$(date '+%Y-%m-%d %H:%M:%S UTC') | ${{ github.event_name }} | ${{ github.run_id }}" >> "$LOG_FILE"

          echo "📝 测试日志: $LOG_FILE"
          echo ""
          echo "📈 最近测试记录:"
          tail -5 "$LOG_FILE" 2>/dev/null || echo "暂无历史记录"
          echo ""
          echo "=========================================="