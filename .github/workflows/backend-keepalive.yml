name: GEO后端保活服务 - 增强版

# 触发条件：
# 1. 定时执行 - 每10分钟运行一次（更频繁的检查）
# 2. 手动触发
# 3. 推送到main分支时也运行一次
on:
  schedule:
    # 每10分钟运行一次，更频繁的检查
    - cron: '*/10 * * * *'

  workflow_dispatch:  # 允许手动触发

  push:
    branches: [ main ]

jobs:
  # 多次唤醒尝试
  multi-wake-attempt:
    name: 🔥 多次唤醒尝试

    runs-on: ubuntu-latest

    steps:
      - name: 🚀 开始多次唤醒流程
        run: |
          echo "📍 目标: https://geo-backend-vp34.onrender.com"
          echo "🎯 策略: 多次请求 + 强力唤醒"
          echo "⏰ 时间: $(date)"

      - name: 🔄 第1次唤醒尝试
        run: |
          echo "🔄 第1次唤醒尝试..."
          curl -v --connect-timeout 60 --max-time 120 \
            -H "User-Agent: GEO-WakeUp-Enhanced/1.0" \
            "https://geo-backend-vp34.onrender.com/api/health" || echo "❌ 第1次尝试失败"

      - name: ⏳ 等待30秒
        run: |
          echo "⏳ 等待30秒让服务启动..."
          sleep 30

      - name: 🔄 第2次唤醒尝试
        run: |
          echo "🔄 第2次唤醒尝试..."
          curl -v --connect-timeout 60 --max-time 120 \
            -H "User-Agent: GEO-WakeUp-Enhanced/1.0" \
            "https://geo-backend-vp34.onrender.com/api/health" || echo "❌ 第2次尝试失败"

      - name: ⏳ 等待30秒
        run: |
          echo "⏳ 再等待30秒..."
          sleep 30

      - name: 🔄 第3次最终唤醒尝试
        run: |
          echo "🔄 第3次最终唤醒尝试..."
          curl -v --connect-timeout 60 --max-time 120 \
            -H "User-Agent: GEO-WakeUp-Enhanced/1.0" \
            "https://geo-backend-vp34.onrender.com/api/health" || echo "❌ 第3次尝试失败"

  # 测试多个端点
  test-multiple-endpoints:
    name: 🧪 测试多个端点

    runs-on: ubuntu-latest
    needs: multi-wake-attempt

    strategy:
      matrix:
        endpoint:
          - '/api/health'
          - '/api'
          - '/'
          - '/api/auth/login'

    steps:
      - name: 🔍 测试端点: ${{ matrix.endpoint }}
        run: |
          BACKEND_URL="https://geo-backend-vp34.onrender.com"
          ENDPOINT="${{ matrix.endpoint }}"
          FULL_URL="${BACKEND_URL}${ENDPOINT}"

          echo "🎯 测试端点: $FULL_URL"
          echo "⏰ 开始时间: $(date)"

          # 尝试连接，设置更长超时
          HTTP_CODE=$(curl -s -w "%{http_code}" \
            --connect-timeout 60 \
            --max-time 120 \
            --retry 5 \
            --retry-delay 15 \
            -H "User-Agent: GEO-Test-Enhanced/1.0" \
            -o /tmp/response.html \
            "$FULL_URL")

          echo "📊 HTTP状态码: $HTTP_CODE"

          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ 端点正常响应"
            echo "📄 响应内容预览:"
            head -20 /tmp/response.html || echo "响应为空"
          elif [ "$HTTP_CODE" = "404" ]; then
            echo "⚠️ 服务在线但路由不存在"
          elif [ "$HTTP_CODE" = "000" ]; then
            echo "❌ 连接完全失败"
          else
            echo "⚠️ 其他状态码: $HTTP_CODE"
            echo "📄 错误响应:"
            cat /tmp/response.html
          fi

          echo "⏰ 完成时间: $(date)"
          echo "---"

  # 强力登录测试
  force-login-test:
    name: 🔐 强力登录测试

    runs-on: ubuntu-latest
    needs: test-multiple-endpoints

    steps:
      - name: 🔍 详细测试登录功能
        run: |
          BACKEND_URL="https://geo-backend-vp34.onrender.com"

          echo "🔐 测试登录功能..."
          echo "👤 测试账号: lml1140490403@163.com"

          # 发送测试登录请求，超时时间更长
          echo "🔄 发送登录请求..."
          HTTP_CODE=$(curl -s -w "%{http_code}" \
            --connect-timeout 60 \
            --max-time 120 \
            --retry 3 \
            --retry-delay 20 \
            -X POST \
            -H "Content-Type: application/json" \
            -H "User-Agent: GEO-Login-Test/1.0" \
            -d '{
              "email": "lml1140490403@163.com",
              "password": "Zwj#1234567890"
            }' \
            -o /tmp/login_response.json \
            "$BACKEND_URL/api/auth/login")

          echo "📊 登录状态码: $HTTP_CODE"

          if [ "$HTTP_CODE" = "200" ]; then
            echo "🎉 登录成功！"
            echo "📄 响应内容:"
            cat /tmp/login_response.json
          elif [ "$HTTP_CODE" = "401" ]; then
            echo "✅ 服务正常，认证失败是预期的（测试账号问题）"
          elif [ "$HTTP_CODE" = "000" ]; then
            echo "❌ 连接失败，服务可能已休眠"
          else
            echo "⚠️ 登录可能有问题"
            echo "📄 错误响应:"
            cat /tmp/login_response.json
          fi

  # 最终状态报告
  final-status-report:
    name: 📊 最终状态报告

    runs-on: ubuntu-latest
    needs: [multi-wake-attempt, test-multiple-endpoints, force-login-test]

    if: always()

    steps:
      - name: 📋 生成执行报告
        run: |
          echo "📊 ===== GEO后端保活服务执行报告 ====="
          echo "📅 执行时间: $(date)"
          echo "🌐 目标服务: https://geo-backend-vp34.onrender.com"
          echo "🎯 策略: 多次唤醒 + 多端点测试 + 登录验证"
          echo ""

          echo "🔄 执行结果:"
          echo "- 多次唤醒尝试: ${{ needs.multi-wake-attempt.result }}"
          echo "- 端点测试: ${{ needs.test-multiple-endpoints.result }}"
          echo "- 登录测试: ${{ needs.force-login-test.result }}"
          echo ""

          if [[ "${{ needs.multi-wake-attempt.result }}" == "success" &&
                "${{ needs.test-multiple-endpoints.result }}" == "success" &&
                "${{ needs.force-login-test.result }}" == "success" ]]; then
            echo "🎉 所有测试通过！后端服务状态良好"
            echo "💡 建议: 服务正常运行，可以正常使用"
          else
            echo "⚠️ 部分测试失败，可能需要手动检查"
            echo "🔧 建议操作:"
            echo "1. 检查Render控制台服务状态"
            echo "2. 手动访问后端URL测试"
            echo "3. 查看服务日志中的错误信息"
          fi

          echo ""
          echo "🌐 用户访问地址: https://still-geo.gocdn.dpdns.org/"
          echo "🔧 管理控制台: https://dashboard.render.com"
          echo "========================================"