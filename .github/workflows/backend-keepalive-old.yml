name: GEO后端保活服务

# 触发条件：
# 1. 定时执行 - 每15分钟运行一次（防止Render免费实例休眠）
# 2. 手动触发 - 可以在GitHub界面手动运行
# 3. 推送到main分支时也运行一次
on:
  schedule:
    # 每15分钟运行一次（Cron格式：分 时 日 月 星期）
    # 使用 */15 确保不会与14分钟的Render休眠时间重叠
    - cron: '*/15 * * * *'

  workflow_dispatch:  # 允许手动触发

  push:
    branches: [ main ]

jobs:
  keep-alive:
    name: 🔥 保活后端服务

    runs-on: ubuntu-latest

    strategy:
      matrix:
        # 多个端点同时ping，确保服务可用性
        endpoint:
          - '/api/health'
          - '/api/auth/login'
          - '/api'

    steps:
      - name: ⏰ 记录执行时间
        run: |
          echo "🚀 GEO后端保活服务启动时间: $(date)"
          echo "🌍 时区: Asia/Shanghai"
          echo "🎯 当前端点: ${{ matrix.endpoint }}"

      - name: 🔍 检查后端服务状态
        id: health-check
        run: |
          BACKEND_URL="https://geo-backend-vp34.onrender.com"
          ENDPOINT="${{ matrix.endpoint }}"
          FULL_URL="${BACKEND_URL}${ENDPOINT}"

          echo "📍 检查URL: $FULL_URL"
          echo "⏱️ 开始时间: $(date)"

          # 尝试连接后端，设置60秒超时
          HTTP_CODE=$(curl -s -o /tmp/response.txt -w "%{http_code}" \
            --max-time 60 \
            --retry 3 \
            --retry-delay 10 \
            -H "User-Agent: GitHub-Actions-Keepalive/1.0" \
            "$FULL_URL")

          echo "📊 HTTP状态码: $HTTP_CODE"

          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ 后端服务正常运行"
            echo "📄 响应内容:"
            cat /tmp/response.txt
            echo "::set-output name=status::success"
            echo "::set-output name=detail::HTTP 200 - 服务正常"
          elif [ "$HTTP_CODE" = "404" ]; then
            echo "⚠️ 服务已启动但路由不存在"
            echo "::set-output name=status::warning"
            echo "::set-output name=detail::HTTP 404 - 服务在线但路由缺失"
          elif [ "$HTTP_CODE" = "000" ]; then
            echo "❌ 连接超时或失败"
            echo "::set-output name=status::failed"
            echo "::set-output name=detail::连接超时 - 可能正在启动"
          else
            echo "⚠️ 其他HTTP状态: $HTTP_CODE"
            echo "::set-output name=status::warning"
            echo "::set-output name=detail::HTTP $HTTP_CODE - 需要检查"
          fi

          echo "⏱️ 完成时间: $(date)"
          echo "---"

      - name: 🧪 测试登录端点（仅对登录路径）
        if: matrix.endpoint == '/api/auth/login'
        run: |
          BACKEND_URL="https://geo-backend-vp34.onrender.com"

          echo "🔐 测试登录功能..."

          # 发送测试登录请求
          HTTP_CODE=$(curl -s -o /tmp/login_response.txt -w "%{http_code}" \
            --max-time 60 \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{"email":"lml1140490403@163.com","password":"Zwj#1234567890"}' \
            "$BACKEND_URL/api/auth/login")

          echo "📊 登录状态码: $HTTP_CODE"

          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ 登录功能正常"
            echo "🎫 Token已获取"
          elif [ "$HTTP_CODE" = "401" ]; then
            echo "✅ 服务正常，认证失败是预期的"
          else
            echo "⚠️ 登录可能有问题，状态码: $HTTP_CODE"
            echo "📄 响应内容:"
            cat /tmp/login_response.txt
          fi

      - name: 📧 发送状态通知（可选）
        if: failure() && github.event_name == 'schedule'
        run: |
          echo "🚨 后端保活检查失败!"
          echo "📅 时间: $(date)"
          echo "🔗 后端URL: https://geo-backend-vp34.onrender.com"
          echo "🎯 失败端点: ${{ matrix.endpoint }}"
          echo ""
          echo "📝 建议检查:"
          echo "1. Render控制台: https://dashboard.render.com"
          echo "2. 手动唤醒: https://geo-backend-vp34.onrender.com/api/health"
          echo "3. 查看服务日志"

      - name: 🎉 执行结果总结
        run: |
          STATUS="${{ steps.health-check.outputs.status }}"
          DETAIL="${{ steps.health-check.outputs.detail }}"
          ENDPOINT="${{ matrix.endpoint }}"

          echo "📊 ===== 执行结果 ====="
          echo "✨ 任务: GEO后端保活服务"
          echo "🎯 端点: $ENDPOINT"
          echo "📈 状态: $STATUS"
          echo "📝 详情: $DETAIL"
          echo "⏰ 完成时间: $(date)"
          echo "=========================="

          # 如果所有检查都成功，显示友好消息
          if [ "$STATUS" = "success" ]; then
            echo "🎉 太棒了！后端服务运行正常"
            echo "🌐 现在可以访问: https://still-geo.gocdn.dpdns.org/"
          fi

  # 详细的健康检查任务
  detailed-health-check:
    name: 🏥 详细健康检查

    runs-on: ubuntu-latest

    needs: keep-alive

    if: github.event_name == 'schedule'  # 只在定时任务时运行

    steps:
      - name: 🔍 全面健康检查
        run: |
          BACKEND_URL="https://geo-backend-vp34.onrender.com"

          echo "🚀 开始详细健康检查..."
          echo "📍 目标服务: $BACKEND_URL"
          echo "⏰ 检查时间: $(date)"
          echo ""

          # 检查多个关键端点
          endpoints=(
            "/api/health"
            "/api"
            "/api/auth/login"
          )

          all_ok=true

          for endpoint in "${endpoints[@]}"; do
            echo "🔍 检查端点: $endpoint"

            HTTP_CODE=$(curl -s -o /tmp/detailed_response.txt -w "%{http_code}" \
              --max-time 60 \
              --connect-timeout 30 \
              "$BACKEND_URL$endpoint")

            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "404" ]; then
              echo "  ✅ 状态: $HTTP_CODE - 正常"
            else
              echo "  ❌ 状态: $HTTP_CODE - 异常"
              all_ok=false
            fi
          done

          echo ""
          echo "📊 ===== 检查总结 ====="
          if [ "$all_ok" = true ]; then
            echo "🎉 所有端点检查通过！"
            echo "🌟 后端服务完全正常"
          else
            echo "⚠️ 发现异常，建议手动检查"
            echo "🔧 控制台: https://dashboard.render.com"
          fi
          echo "======================="

  # 每日总结任务
  daily-summary:
    name: 📊 每日服务报告

    runs-on: ubuntu-latest

    needs: [keep-alive, detailed-health-check]

    if: github.event_name == 'schedule' && github.event.schedule == '0 8 * * *'  # 每天上午8点

    steps:
      - name: 📈 生成每日报告
        run: |
          echo "📊 ===== GEO SaaS 每日服务报告 ====="
          echo "📅 报告日期: $(date +'%Y-%m-%d %H:%M:%S')"
          echo "🌐 服务地址: https://still-geo.gocdn.dpdns.org"
          echo "🔧 后端地址: https://geo-backend-vp34.onrender.com"
          echo ""
          echo "🔄 自动保活状态: ✅ 每15分钟检查一次"
          echo "📱 前端服务: ✅ Vercel自动部署"
          echo "🗄️ 后端服务: ✅ Render托管"
          echo ""
          echo "💡 建议操作:"
          echo "1. 每周检查一次服务日志"
          echo "2. 监控用户反馈"
          echo "3. 考虑升级到付费计划以获得更好稳定性"
          echo ""
          echo "🎯 目标: 保持99%+的服务可用性"
          echo "===================================="