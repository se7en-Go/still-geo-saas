name: 🛡️ 生产级后端保活服务

# 设计理念：
# 1. 分阶段执行 - 唤醒→验证→保活→监控
# 2. 智能容错 - 每个阶段独立，允许部分失败
# 3. 渐进式重试 - 指数退避 + 智能等待
# 4. 状态持久化 - 跨阶段共享状态信息
# 5. 监控友好 - 详细的状态报告和历史追踪

on:
  schedule:
    # 更精确的cron调度 - 使用特定分钟值避免GitHub Actions队列问题
    - cron: '2,16,30,44,58 * * * *'  # 每14分钟但在第2,16,30,44,58分钟执行

  workflow_dispatch:
    inputs:
      strategy:
        description: '执行策略'
        required: false
        default: 'standard'
        type: choice
        options:
        - standard
        - aggressive
        - minimal

      debug_mode:
        description: '启用调试模式'
        required: false
        default: false
        type: boolean

env:
  BACKEND_URL: 'https://geo-backend-vp34.onrender.com'
  HEALTH_ENDPOINT: '/api/health'
  LOGIN_ENDPOINT: '/api/auth/login'
  USER_AGENT: 'GEO-Production-KeepAlive/2.2'
  TIMEOUT_BASE: 60  # 增加基础超时时间
  MAX_RETRIES: 3     # 减少重试次数避免过度失败
  # 新增监控变量
  WORKFLOW_ID: 'keepalive-${{ github.run_number }}-${{ github.run_attempt }}'
  LOG_LEVEL: 'info'
  # 网络配置优化
  CURL_CONNECT_TIMEOUT: 20
  CURL_MAX_TIME: 45

jobs:
  # ========================================
  # 阶段1: 初始化和状态检查
  # ========================================
  initialize:
    name: 🚀 初始化和状态检查
    runs-on: ubuntu-latest

    outputs:
      strategy: ${{ steps.setup.outputs.strategy }}
      debug_mode: ${{ steps.setup.outputs.debug_mode }}
      initial_status: ${{ steps.health_check.outputs.status }}
      execution_id: ${{ steps.setup.outputs.execution_id }}

    steps:
      - name: 🔍 网络连接诊断
        run: |
          echo "🌐 ===== 网络连接诊断 ====="
          echo "🎯 目标服务: $BACKEND_URL"
          echo "⏰ 诊断时间: $(date)"
          echo ""

          # 基础网络测试
          echo "🔹 测试DNS解析..."
          nslookup geo-backend-vp34.onrender.com || echo "DNS解析失败"

          echo ""
          echo "🔹 测试基础连通性..."
          ping -c 3 geo-backend-vp34.onrender.com || echo "Ping测试失败"

          echo ""
          echo "🔹 测试HTTPS连接..."
          timeout 30 openssl s_client -connect geo-backend-vp34.onrender.com:443 -verify_return_error < /dev/null || echo "HTTPS连接测试失败"

          echo ""
          echo "🔹 检查curl版本..."
          curl --version | head -1

          echo ""
          echo "========================================"

      - name: 📋 设置执行环境
        id: setup
        run: |
          STRATEGY="${{ github.event.inputs.strategy || 'standard' }}"
          DEBUG="${{ github.event.inputs.debug_mode || 'false' }}"
          EXECUTION_ID="keepalive-$(date +%Y%m%d-%H%M%S)-${GITHUB_RUN_NUMBER}"

          echo "strategy=$STRATEGY" >> $GITHUB_OUTPUT
          echo "debug_mode=$DEBUG" >> $GITHUB_OUTPUT
          echo "execution_id=$EXECUTION_ID" >> $GITHUB_OUTPUT

          echo "🎯 执行策略: $STRATEGY"
          echo "🐛 调试模式: $DEBUG"
          echo "🆔 执行ID: $EXECUTION_ID"
          echo "⏰ 开始时间: $(date)"

      - name: 🏥 初始健康检查
        id: health_check
        continue-on-error: true
        run: |
          echo "🔍 执行初始健康检查..."

          # 快速检查服务状态 (优化超时配置)
          HTTP_CODE=$(curl -s -w "%{http_code}" \
            --connect-timeout $CURL_CONNECT_TIMEOUT \
            --max-time $CURL_MAX_TIME \
            --retry $MAX_RETRIES \
            --retry-delay 10 \
            --retry-max-time 120 \
            -H "User-Agent: $USER_AGENT" \
            --compressed \
            --keepalive-time 30 \
            -o /tmp/initial_health.json \
            "$BACKEND_URL$HEALTH_ENDPOINT" || echo "000")

          echo "📊 初始状态码: $HTTP_CODE"

          if [ "$HTTP_CODE" = "200" ]; then
            echo "status=healthy" >> $GITHUB_OUTPUT
            echo "✅ 服务已运行"
            cat /tmp/initial_health.json 2>/dev/null || echo "响应为空"
          else
            echo "status=cold" >> $GITHUB_OUTPUT
            echo "❌ 服务处于休眠状态"
          fi

      - name: 💾 保存初始状态
        run: |
          echo "📝 保存执行状态到 artifacts..."
          mkdir -p ./status
          cat <<EOF > ./status/initial_status.json
          {
            "execution_id": "${{ steps.setup.outputs.execution_id }}",
            "timestamp": "$(date -Iseconds)",
            "strategy": "${{ steps.setup.outputs.strategy }}",
            "initial_status": "${{ steps.health_check.outputs.status }}",
            "backend_url": "$BACKEND_URL"
          }
          EOF

          cat ./status/initial_status.json

  # ========================================
  # 阶段2: 智能唤醒服务
  # ========================================
  wakeup:
    name: 🔥 智能唤醒服务
    runs-on: ubuntu-latest
    needs: initialize
    if: always() && needs.initialize.result == 'success'

    outputs:
      wakeup_success: ${{ steps.wakeup_result.outputs.success }}
      wakeup_attempts: ${{ steps.wakeup_result.outputs.attempts }}
      final_status_code: ${{ steps.wakeup_result.outputs.final_status_code }}

    steps:
      - name: 🔍 决定唤醒策略
        id: strategy
        run: |
          INITIAL_STATUS="${{ needs.initialize.outputs.initial_status }}"
          STRATEGY="${{ needs.initialize.outputs.strategy }}"

          case "$INITIAL_STATUS" in
            "healthy")
              echo "need_wakeup=false" >> $GITHUB_OUTPUT
              echo "🎉 服务已运行，跳过唤醒阶段"
              ;;
            "cold")
              echo "need_wakeup=true" >> $GITHUB_OUTPUT
              echo "❄️ 服务休眠，需要唤醒"
              ;;
            *)
              echo "need_wakeup=true" >> $GITHUB_OUTPUT
              echo "❓ 状态未知，执行唤醒检查"
              ;;
          esac

          case "$STRATEGY" in
            "aggressive")
              echo "max_attempts=6" >> $GITHUB_OUTPUT
              echo "base_delay=15" >> $GITHUB_OUTPUT
              echo "max_time=240" >> $GITHUB_OUTPUT
              echo "connect_timeout=25" >> $GITHUB_OUTPUT
              echo "max_time_per_request=60" >> $GITHUB_OUTPUT
              ;;
            "minimal")
              echo "max_attempts=2" >> $GITHUB_OUTPUT
              echo "base_delay=10" >> $GITHUB_OUTPUT
              echo "max_time=90" >> $GITHUB_OUTPUT
              echo "connect_timeout=20" >> $GITHUB_OUTPUT
              echo "max_time_per_request=45" >> $GITHUB_OUTPUT
              ;;
            *)
              echo "max_attempts=4" >> $GITHUB_OUTPUT
              echo "base_delay=20" >> $GITHUB_OUTPUT
              echo "max_time=180" >> $GITHUB_OUTPUT
              echo "connect_timeout=$CURL_CONNECT_TIMEOUT" >> $GITHUB_OUTPUT
              echo "max_time_per_request=$CURL_MAX_TIME" >> $GITHUB_OUTPUT
              ;;
          esac

      - name: 🚀 执行智能唤醒
        id: wakeup_result
        if: steps.strategy.outputs.need_wakeup == 'true'
        run: |
          MAX_ATTEMPTS="${{ steps.strategy.outputs.max_attempts }}"
          BASE_DELAY="${{ steps.strategy.outputs.base_delay }}"
          MAX_TIME="${{ steps.strategy.outputs.max_time }}"
          CONNECT_TIMEOUT="${{ steps.strategy.outputs.connect_timeout }}"
          MAX_TIME_PER_REQUEST="${{ steps.strategy.outputs.max_time_per_request }}"

          echo "🔥 开始智能唤醒服务..."
          echo "📊 最大尝试次数: $MAX_ATTEMPTS"
          echo "⏱️ 基础延迟: ${BASE_DELAY}秒"
          echo "🕐 最大执行时间: ${MAX_TIME}秒"

          START_TIME=$(date +%s)
          SUCCESS=false
          FINAL_STATUS_CODE="000"

          for attempt in $(seq 1 $MAX_ATTEMPTS); do
            CURRENT_TIME=$(date +%s)
            ELAPSED=$((CURRENT_TIME - START_TIME))

            if [ $ELAPSED -gt $MAX_TIME ]; then
              echo "⏰ 超过最大执行时间，停止尝试"
              break
            fi

            echo ""
            echo "🔄 第 $attempt/$MAX_ATTEMPTS 次唤醒尝试 (耗时: ${ELAPSED}秒)..."

            # 多重唤醒策略：按优先级执行
            STRATEGY_SUCCESS=false

            # 策略1: 根路径轻量级探测 (优化网络配置)
            echo "🔍 策略1: 根路径探测..."
            HTTP_CODE=$(curl -s -w "%{http_code}" \
              --connect-timeout $CONNECT_TIMEOUT \
              --max-time $MAX_TIME_PER_REQUEST \
              --retry $MAX_RETRIES \
              --retry-delay 10 \
              --retry-max-time 120 \
              -H "User-Agent: $USER_AGENT-Probe" \
              -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8" \
              --compressed \
              --keepalive-time 30 \
              -o /tmp/probe_response.json \
              "$BACKEND_URL/" || echo "000")

            echo "📡 根路径状态码: $HTTP_CODE"

            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "302" ]; then
              echo "✅ 根路径探测成功！"
              STRATEGY_SUCCESS=true
            fi

            # 策略2: API健康检查 (优化网络配置)
            if [ "$STRATEGY_SUCCESS" = "false" ]; then
              echo "🏥 策略2: API健康检查..."
              HTTP_CODE=$(curl -s -w "%{http_code}" \
                --connect-timeout $CONNECT_TIMEOUT \
                --max-time $MAX_TIME_PER_REQUEST \
                --retry $MAX_RETRIES \
                --retry-delay 10 \
                --retry-max-time 120 \
                -H "User-Agent: $USER_AGENT-Health" \
                -H "Accept: application/json" \
                --compressed \
                --keepalive-time 30 \
                -o /tmp/health_response.json \
                "$BACKEND_URL$HEALTH_ENDPOINT" || echo "000")

              echo "📊 健康检查状态码: $HTTP_CODE"

              if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "401" ]; then
                echo "🎉 API健康检查通过！"
                STRATEGY_SUCCESS=true
                cat /tmp/health_response.json 2>/dev/null || echo "健康检查响应为空"
              fi
            fi

            # 策略3: 多端点并发唤醒（前3次尝试）
            if [ "$STRATEGY_SUCCESS" = "false" ] && [ $attempt -le 3 ]; then
              echo "⚡ 策略3: 多端点并发唤醒..."

              # 并发执行多个唤醒请求
              (
                curl -s --connect-timeout 12 --max-time 20 \
                  -H "User-Agent: $USER-Agent-Wake-1" \
                  "$BACKEND_URL/" &
              )
              (
                curl -s --connect-timeout 12 --max-time 20 \
                  -H "User-Agent: $USER-Agent-Wake-2" \
                  "$BACKEND_URL/api" &
              )
              (
                curl -s --connect-timeout 12 --max-time 20 \
                  -X POST \
                  -H "User-Agent: $USER-Agent-Wake-3" \
                  -H "Content-Type: application/json" \
                  -d '{"test": "wakeup"}' \
                  "$BACKEND_URL/api/auth/login" &
              )

              # 等待所有后台任务完成
              wait
              echo "⚡ 并发唤醒请求已发送"

              # 短暂等待后检查结果
              sleep 8

              # 重新检查服务状态
              HTTP_CODE=$(curl -s -w "%{http_code}" \
                --connect-timeout 8 \
                --max-time 15 \
                -H "User-Agent: $USER_AGENT-Check" \
                -o /dev/null \
                "$BACKEND_URL/")

              if [ "$HTTP_CODE" = "200" ]; then
                echo "🎯 并发唤醒成功！"
                STRATEGY_SUCCESS=true
              fi
            fi

            # 策略4: 强力持续唤醒（仅限前2次）
            if [ "$STRATEGY_SUCCESS" = "false" ] && [ $attempt -le 2 ]; then
              echo "💪 策略4: 强力持续唤醒..."

              # 连续发送多个请求
              for i in {1..3}; do
                curl -v --connect-timeout 15 --max-time 30 \
                  -H "User-Agent: $USER-Agent-Force" \
                  -H "Accept: application/json,text/html,*/*" \
                  "$BACKEND_URL/" 2>/dev/null || true
                sleep 2
              done

              echo "💪 强力唤醒完成，等待服务响应..."
              sleep 10
            fi

            # 最终验证
            echo "🔎 最终验证服务状态..."
            HTTP_CODE=$(curl -s -w "%{http_code}" \
              --connect-timeout 10 \
              --max-time 30 \
              --retry 1 \
              -H "User-Agent: $USER_AGENT-Final" \
              -o /tmp/final_response.json \
              "$BACKEND_URL$HEALTH_ENDPOINT")

            echo "📊 最终状态码: $HTTP_CODE"

            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "401" ]; then
              echo "🎉 唤醒成功！"
              SUCCESS=true
              FINAL_STATUS_CODE="$HTTP_CODE"
              cat /tmp/final_response.json 2>/dev/null || echo "最终响应为空"
              break
            fi

            if [ $attempt -lt $MAX_ATTEMPTS ]; then
              # 智能延迟：指数退避 + 随机抖动
              DELAY=$((BASE_DELAY * (2 ** (attempt - 1))))
              JITTER=$((RANDOM % 5))
              TOTAL_DELAY=$((DELAY + JITTER))

              echo "⏳ 等待 ${TOTAL_DELAY} 秒后重试..."
              sleep $TOTAL_DELAY
            fi
          done

          # 保存结果
          echo "success=$SUCCESS" >> $GITHUB_OUTPUT
          echo "attempts=$attempt" >> $GITHUB_OUTPUT
          echo "final_status_code=$FINAL_STATUS_CODE" >> $GITHUB_OUTPUT

          if [ "$SUCCESS" = "true" ]; then
            echo "🎉 唤醒成功！"
          else
            echo "❌ 唤醒失败，但继续执行后续检查"
          fi

      - name: ✅ 唤醒结果确认
        run: |
          echo "📋 ===== 唤醒阶段总结 ====="
          echo "🎯 执行ID: ${{ needs.initialize.outputs.execution_id }}"
          echo "🔥 需要唤醒: ${{ steps.strategy.outputs.need_wakeup }}"
          echo "✅ 唤醒成功: ${{ steps.wakeup_result.outputs.success }}"
          echo "🔄 尝试次数: ${{ steps.wakeup_result.outputs.attempts }}"
          echo "📊 最终状态码: ${{ steps.wakeup_result.outputs.final_status_code }}"
          echo "==========================="

  # ========================================
  # 阶段3: 功能验证
  # ========================================
  verification:
    name: 🧪 功能验证
    runs-on: ubuntu-latest
    needs: [initialize, wakeup]
    if: always() && (needs.initialize.result == 'success' && needs.wakeup.result == 'success')

    strategy:
      fail-fast: false
      matrix:
        test:
          - name: '基础连接测试'
            endpoint: '/api/health'
            method: 'GET'
            expected_codes: '200,404'
            timeout: 30
          - name: 'API根目录测试'
            endpoint: '/api'
            method: 'GET'
            expected_codes: '200,404'
            timeout: 30
          - name: '登录端点测试'
            endpoint: '/api/auth/login'
            method: 'POST'
            expected_codes: '200,401,400'
            timeout: 30
            data: '{"email": "healthcheck@example.com", "password": "test123"}'

    steps:
      - name: "🧪 执行测试: ${{ matrix.test.name }}"
        continue-on-error: true
        run: |
          TEST_NAME="${{ matrix.test.name }}"
          ENDPOINT="${{ matrix.test.endpoint }}"
          METHOD="${{ matrix.test.method }}"
          EXPECTED_CODES="${{ matrix.test.expected_codes }}"
          TIMEOUT="${{ matrix.test.timeout }}"
          TEST_DATA="${{ matrix.test.data }}"

          echo "🔍 开始测试: $TEST_NAME"
          echo "🎯 端点: $METHOD $ENDPOINT"
          echo "⏱️ 超时: ${TIMEOUT}秒"
          echo "📊 期望状态码: $EXPECTED_CODES"

          # 构建curl命令
          CURL_CMD="curl -s -w '%{http_code}'"
          CURL_CMD="$CURL_CMD --connect-timeout 15"
          CURL_CMD="$CURL_CMD --max-time $TIMEOUT"
          CURL_CMD="$CURL_CMD --retry 2"
          CURL_CMD="$CURL_CMD --retry-delay 5"
          CURL_CMD="$CURL_CMD -H 'User-Agent: $USER-Agent-Test'"

          if [ "$METHOD" = "POST" ]; then
            CURL_CMD="$CURL_CMD -X POST"
            CURL_CMD="$CURL_CMD -H 'Content-Type: application/json'"
            CURL_CMD="$CURL_CMD -d '$TEST_DATA'"
          fi

          CURL_CMD="$CURL_CMD -o /tmp/test_response.json"
          CURL_CMD="$CURL_CMD '$BACKEND_URL$ENDPOINT'"

          # 执行测试
          HTTP_CODE=$(eval "$CURL_CMD")

          echo "📡 实际状态码: $HTTP_CODE"

          # 检查结果
          SUCCESS=false
          for code in $(echo $EXPECTED_CODES | tr ',' ' '); do
            if [ "$HTTP_CODE" = "$code" ]; then
              SUCCESS=true
              break
            fi
          done

          if [ "$SUCCESS" = "true" ]; then
            echo "✅ 测试通过: $TEST_NAME"
            echo "📄 响应内容:"
            cat /tmp/test_response.json 2>/dev/null | head -10 || echo "响应为空或不是JSON"
          else
            echo "❌ 测试失败: $TEST_NAME"
            echo "📄 错误响应:"
            cat /tmp/test_response.json 2>/dev/null || echo "无响应内容"
            exit 1
          fi

  # ========================================
  # 阶段4: 状态报告和监控
  # ========================================
  reporting:
    name: 📊 状态报告
    runs-on: ubuntu-latest
    needs: [initialize, wakeup, verification]
    if: always()

    steps:
      - name: 📋 生成综合报告
        run: |
          echo "📊 ===== GEO后端保活服务执行报告 ====="
          echo "🆔 执行ID: ${{ needs.initialize.outputs.execution_id }}"
          echo "📅 执行时间: $(date)"
          echo "⏰ 开始时间: $(date -d '@$(date +%s - 3600)')"  # 假设开始时间
          echo ""

          echo "🎯 执行策略: ${{ needs.initialize.outputs.strategy }}"
          echo "🐛 调试模式: ${{ needs.initialize.outputs.debug_mode }}"
          echo "🌐 目标服务: $BACKEND_URL"
          echo ""

          echo "📊 各阶段执行结果:"
          echo "  🚀 初始化: ${{ needs.initialize.result }}"
          echo "  🔥 唤醒: ${{ needs.wakeup.result }}"
          echo "  🧪 验证: ${{ needs.verification.result }}"
          echo ""

          # 判断整体状态
          if [[ "${{ needs.initialize.result }}" == "success" &&
                ( "${{ needs.wakeup.result }}" == "success" || "${{ needs.wakeup.result }}" == "skipped" ) &&
                ( "${{ needs.verification.result }}" == "success" || "${{ needs.verification.result }}" == "skipped" ) ]]; then
            echo "🎉 整体状态: 成功"
            echo "💡 建议: 后端服务运行正常，用户可以正常访问"
          else
            echo "⚠️ 整体状态: 部分成功"
            echo "💡 建议: 部分检查未通过，但基本功能可用"
          fi

          echo ""
          echo "🔗 相关链接:"
          echo "  🏠 用户前端: https://still-geo.gocdn.dpdns.org/"
          echo "  🔧 后端API: $BACKEND_URL"
          echo "  📊 Render控制台: https://dashboard.render.com"
          echo "  📈 GitHub Actions: https://github.com/${{ github.repository }}/actions"
          echo ""
          echo "========================================="

      - name: 📧 生成状态徽章
        run: |
          # 根据结果生成状态信息
          if [[ "${{ needs.initialize.result }}" == "success" &&
                ( "${{ needs.wakeup.result }}" == "success" || "${{ needs.wakeup.result }}" == "skipped" ) &&
                ( "${{ needs.verification.result }}" == "success" || "${{ needs.verification.result }}" == "skipped" ) ]]; then
            STATUS="success"
            COLOR="brightgreen"
            MESSAGE="✅%20在线"
          else
            STATUS="warning"
            COLOR="orange"
            MESSAGE="⚠️%20检查"
          fi

          echo "📊 状态徽章信息:"
          echo "  状态: $STATUS"
          echo "  颜色: $COLOR"
          echo "  消息: $MESSAGE"
          echo ""
          echo "🔗 徽章URL: https://img.shields.io/badge/GEO%20Backend-$MESSAGE-$COLOR"

      - name: 🔔 通知设置 (仅失败时)
        if: contains(needs.*.result, 'failure')
        run: |
          echo "🚨 检测到执行失败，建议检查以下项目:"
          echo "1. 📊 查看GitHub Actions执行日志"
          echo "2. 🔧 登录Render控制台检查服务状态"
          echo "3. 📋 查看服务日志中的错误信息"
          echo "4. 🌐 手动访问后端服务进行测试"
          echo ""
          echo "🔧 故障排除步骤:"
          echo "- 检查环境变量配置"
          echo "- 验证数据库连接"
          echo "- 确认依赖包安装"
          echo "- 查看内存和CPU使用情况"

  # ========================================
  # 阶段5: 清理和归档
  # ========================================
  cleanup:
    name: 🧹 清理和归档
    runs-on: ubuntu-latest
    needs: [initialize, wakeup, verification, reporting]
    if: always()

    steps:
      - name: 🗂️ 归档执行记录
        if: always()
        run: |
          echo "📝 归档执行记录..."

          # 创建执行记录
          cat <<EOF > execution_record.json
          {
            "execution_id": "${{ needs.initialize.outputs.execution_id }}",
            "timestamp": "$(date -Iseconds)",
            "strategy": "${{ needs.initialize.outputs.strategy }}",
            "results": {
              "initialize": "${{ needs.initialize.result }}",
              "wakeup": "${{ needs.wakeup.result }}",
              "verification": "${{ needs.verification.result }}",
              "reporting": "${{ needs.reporting.result }}"
            },
            "backend_url": "$BACKEND_URL",
            "workflow_run_id": "${{ github.run_id }}",
            "repository": "${{ github.repository }}"
          }
          EOF

          echo "📊 执行记录已生成:"
          cat execution_record.json

      - name: 📊 性能统计
        run: |
          echo "📈 ===== 性能统计 ====="
          echo "⏱️ 工作流开始时间: ${{ github.event.created_at }}"
          echo "🔄 当前时间: $(date)"
          echo "🏃 执行者: ${{ github.actor }}"
          echo "🌟 仓库: ${{ github.repository }}"
          echo "🎯 触发事件: ${{ github.event_name }}"
          echo "========================"

  # ========================================
  # 阶段6: 外部监控和告警 (新增)
  # ========================================
  external-monitoring:
    name: 📊 外部监控和告警
    runs-on: ubuntu-latest
    needs: [initialize, wakeup, verification, reporting]
    if: always()

    steps:
      - name: 📈 执行结果统计
        run: |
          echo "📊 ===== 执行结果统计 ====="
          echo "🆔 工作流ID: $WORKFLOW_ID"
          echo "⏰ 执行时间: $(date)"
          echo "🌐 目标服务: $BACKEND_URL"
          echo ""

          # 统计各阶段结果
          INIT_RESULT="${{ needs.initialize.result }}"
          WAKEUP_RESULT="${{ needs.wakeup.result }}"
          VERIF_RESULT="${{ needs.verification.result }}"
          REPORT_RESULT="${{ needs.reporting.result }}"

          echo "📋 各阶段结果:"
          echo "  🚀 初始化: $INIT_RESULT"
          echo "  🔥 唤醒: $WAKEUP_RESULT"
          echo "  🧪 验证: $VERIF_RESULT"
          echo "  📊 报告: $REPORT_RESULT"
          echo ""

          # 计算成功率
          SUCCESS_COUNT=0
          TOTAL_COUNT=0

          for result in "$INIT_RESULT" "$WAKEUP_RESULT" "$VERIF_RESULT" "$REPORT_RESULT"; do
            if [ "$result" = "success" ]; then
              SUCCESS_COUNT=$((SUCCESS_COUNT + 1))
            fi
            if [ "$result" != "skipped" ]; then
              TOTAL_COUNT=$((TOTAL_COUNT + 1))
            fi
          done

          if [ $TOTAL_COUNT -gt 0 ]; then
            SUCCESS_RATE=$((SUCCESS_COUNT * 100 / TOTAL_COUNT))
            echo "📈 成功率: $SUCCESS_RATE% ($SUCCESS_COUNT/$TOTAL_COUNT)"
          else
            echo "📈 成功率: N/A (无执行的阶段)"
          fi

          # 保存统计信息供后续使用
          echo "success_rate=$SUCCESS_RATE" >> $GITHUB_ENV
          echo "success_count=$SUCCESS_COUNT" >> $GITHUB_ENV
          echo "total_count=$TOTAL_COUNT" >> $GITHUB_ENV

      - name: 🎯 性能指标收集
        run: |
          echo "🎯 ===== 性能指标收集 ====="

          # 执行性能测试
          START_TIME=$(date +%s)

          # 测试响应时间
          RESPONSE_TIME=$(curl -s -w "%{time_total}" \
            --connect-timeout 10 \
            --max-time 30 \
            -o /dev/null \
            "$BACKEND_URL$HEALTH_ENDPOINT")

          END_TIME=$(date +%s)

          echo "⏱️ 健康检查响应时间: ${RESPONSE_TIME}秒"
          echo "⏰ 总执行时间: $((END_TIME - START_TIME))秒"

          # 保存性能指标
          echo "response_time=$RESPONSE_TIME" >> $GITHUB_ENV
          echo "total_time=$((END_TIME - START_TIME))" >> $GITHUB_ENV

          # 性能评估
          if (( $(echo "$RESPONSE_TIME < 5.0" | bc -l) )); then
            echo "✅ 性能: 优秀 (< 5秒)"
          elif (( $(echo "$RESPONSE_TIME < 10.0" | bc -l) )); then
            echo "⚠️ 性能: 良好 (5-10秒)"
          else
            echo "❌ 性能: 需要优化 (> 10秒)"
          fi

      - name: 🔔 状态告警检查
        if: contains(needs.*.result, 'failure')
        run: |
          echo "🔔 ===== 状态告警检查 ====="
          echo "⚠️ 检测到执行失败，发送告警..."

          # 构建告警消息
          MESSAGE="🚨 GEO后端保活服务执行失败\n"
          MESSAGE+="📅 时间: $(date)\n"
          MESSAGE+="🌐 服务: $BACKEND_URL\n"
          MESSAGE+="📊 成功率: ${{ env.success_rate }}%\n"
          MESSAGE+="🔗 查看详情: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          echo "📧 告警消息内容:"
          echo -e "$MESSAGE"

          # 在实际项目中，这里可以添加Slack、邮件或其他通知方式
          # curl -X POST -H 'Content-type: application/json' \
          #   --data "{\"text\":\"$MESSAGE\"}" \
          #   "$SLACK_WEBHOOK_URL"

      - name: 📋 创建执行报告
        if: always()
        run: |
          echo "📋 ===== 创建执行报告 ====="

          REPORT_FILE="keepalive_report_$(date +%Y%m%d_%H%M%S).json"

          cat << EOF > "$REPORT_FILE"
          {
            "workflow_id": "$WORKFLOW_ID",
            "timestamp": "$(date -Iseconds)",
            "backend_url": "$BACKEND_URL",
            "results": {
              "initialize": "${{ needs.initialize.result }}",
              "wakeup": "${{ needs.wakeup.result }}",
              "verification": "${{ needs.verification.result }}",
              "reporting": "${{ needs.reporting.result }}",
              "monitoring": "${{ needs.external-monitoring.result }}"
            },
            "metrics": {
              "success_rate": "${{ env.success_rate }}",
              "response_time": "${{ env.response_time }}",
              "total_execution_time": "${{ env.total_time }}"
            },
            "github_context": {
              "run_id": "${{ github.run_id }}",
              "run_number": "${{ github.run_number }}",
              "repository": "${{ github.repository }}",
              "event_name": "${{ github.event_name }}",
              "actor": "${{ github.actor }}"
            }
          }
          EOF

          echo "📄 执行报告已生成: $REPORT_FILE"
          echo "📊 报告内容:"
          cat "$REPORT_FILE" | head -20

          # 可以考虑将报告上传到artifact或其他存储
          # echo "::set-output name=report_file::$REPORT_FILE"

      - name: ✨ 执行总结
        if: always()
        run: |
          echo "✨ ===== 最终执行总结 ====="
          echo "🎯 工作流ID: $WORKFLOW_ID"
          echo "⏰ 完成时间: $(date)"
          echo "📊 成功率: ${{ env.success_rate }}%"
          echo "⏱️ 响应时间: ${{ env.response_time }}秒"
          echo ""

          if [ "${{ env.success_rate }}" -ge 80 ]; then
            echo "🎉 整体评估: 优秀 - 服务保活成功"
          elif [ "${{ env.success_rate }}" -ge 60 ]; then
            echo "⚠️ 整体评估: 良好 - 大部分功能正常"
          else
            echo "❌ 整体评估: 需要关注 - 建议检查服务状态"
          fi

          echo ""
          echo "🔗 相关链接:"
          echo "  🏠 用户前端: https://still-geo.gocdn.dpdns.org/"
          echo "  🔧 后端API: $BACKEND_URL"
          echo "  📊 GitHub Actions: https://github.com/${{ github.repository }}/actions"
          echo "=========================================="